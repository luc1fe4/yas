apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: yas-mtls-strict-dev
  namespace: dev
spec:
  selector:
    matchLabels:
      security.istio.io/tlsMode: istio
  mtls:
    mode: PERMISSIVE
  portLevelMtls:
    8090:
      mode: PERMISSIVE
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: yas-mtls-strict-staging
  namespace: staging
spec:
  selector:
    matchLabels:
      security.istio.io/tlsMode: istio
  mtls:
    mode: PERMISSIVE
  portLevelMtls:
    8090:
      mode: PERMISSIVE
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: yas-mtls-strict-sandbox
  namespace: developer-sandbox
spec:
  mtls:
    mode: STRICT
