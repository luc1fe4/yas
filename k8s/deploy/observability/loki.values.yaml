write:
  replicas: 1
  nodeSelector:
    type: heavy
read:
  replicas: 1
  nodeSelector:
    type: heavy
backend:
  replicas: 1
  nodeSelector:
    type: heavy
loki:
  commonConfig:
    replication_factor: 1
  auth_enabled: false
  limits_config:
    ingestion_rate_mb: 20
    ingestion_burst_size_mb: 30
    per_stream_rate_limit: "5MB"
    per_stream_rate_limit_burst: "15MB"
test:
  enabled: false
storage:
  type: 'filesystem'
minio:
  enabled: true
  nodeSelector:
    type: heavy
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false