apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-sampledata
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/luc1fe4/yas.git'
    targetRevision: 'v2.0.0'
    path: k8s/charts/sampledata
    helm:
      parameters:
        - name: backend.image.tag
          value: 'v2.0.0'
        - name: backend.image.repository
          value: 'besukem/sampledata'
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
