apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: staging-backoffice-bff
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/luc1fe4/yas.git'
    targetRevision: 'v3.0.1'
    path: k8s/charts/backoffice-bff
    helm:
      parameters:
        - name: backend.image.repository
          value: 'besukem/backoffice-bff'
        - name: backend.image.tag
          value: 'v3.0.1'
        - name: backend.service.nodePort
          value: "30196"
  destination:
    server: https://kubernetes.default.svc
    namespace: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
