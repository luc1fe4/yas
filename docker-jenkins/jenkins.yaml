jenkins:
  systemMessage: "YAS Jenkins Automation - Configuration as Code (JCasC)"

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "snyk-token"
              secret: "dummy-snyk-token"
              description: "Snyk API Token"
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "dummy-sonar-token"
              description: "SonarQube API Token"
          - usernamePassword:
              scope: GLOBAL
              id: "dockerhub-credentials"
              username: "dummy-username"
              password: "dummy-password"
              description: "DockerHub Credentials"

tool:
  jdk:
    installations:
      - name: "jdk21"
        home: "/opt/java/openjdk"
  maven:
    installations:
      - name: "Maven-3.9"
        properties:
          - installSource:
              installers:
                - maven:
                    id: "3.9.6"
  nodejs:
    installations:
      - name: "nodejs"
        home: "/usr"

jobs:
  - script: >
      pipelineJob('developer_build') {
        description('Pipeline triển khai tự động các service dựa theo tham số tag của nhà phát triển.')
        parameters {
          stringParam('NAMESPACE', 'dev', 'K8s Namespace triển khai (Ví dụ: dev, staging, qa)')
          booleanParam('DRY_RUN', false, 'Chạy mô phỏng (Dry Run) trước. Bỏ check để deploy THỰC TẾ lên K8s.')
          
          stringParam('TAG_cart', 'latest', 'Commit ID / Tag Docker image cho cart')
          stringParam('TAG_customer', 'latest', 'Commit ID / Tag Docker image cho customer')
          stringParam('TAG_inventory', 'latest', 'Commit ID / Tag Docker image cho inventory')
          stringParam('TAG_media', 'latest', 'Commit ID / Tag Docker image cho media')
          stringParam('TAG_order', 'latest', 'Commit ID / Tag Docker image cho order')
          stringParam('TAG_product', 'latest', 'Commit ID / Tag Docker image cho product')
          stringParam('TAG_search', 'latest', 'Commit ID / Tag Docker image cho search')
          stringParam('TAG_tax', 'latest', 'Commit ID / Tag Docker image cho tax')
          stringParam('TAG_sampledata', 'latest', 'Commit ID / Tag Docker image cho sampledata')
          
          stringParam('TAG_backoffice_bff', 'latest', 'Commit ID / Tag Docker image cho backoffice-bff')
          stringParam('TAG_storefront_bff', 'latest', 'Commit ID / Tag Docker image cho storefront-bff')
          stringParam('TAG_backoffice_ui', 'latest', 'Commit ID / Tag Docker image cho backoffice-ui')
          stringParam('TAG_storefront_ui', 'latest', 'Commit ID / Tag Docker image cho storefront-ui')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/luc1fe4/yas.git')
                }
                branch('main')
              }
            }
            scriptPath('Jenkinsfile-developer-build')
          }
        }
      }
      
      pipelineJob('developer_cleanup') {
        description('Xóa toàn bộ Helm releases của developer_build khỏi namespace trên K8s.')
        parameters {
          stringParam('NAMESPACE', 'dev', 'Namespace cần dọn dẹp (xóa toàn bộ Helm releases)')
          booleanParam('DRY_RUN', true, 'Chạy thử trước. Bỏ check để xóa THẬT.')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/luc1fe4/yas.git')
                }
                branch('main')
              }
            }
            scriptPath('Jenkinsfile-developer-cleanup')
          }
        }
      }

      pipelineJob('auto_deploy_dev') {
        description('Tự động build/push Docker image và deploy vào namespace dev khi main thay đổi.')
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/luc1fe4/yas.git')
                }
                branch('main')
              }
            }
            scriptPath('Jenkinsfile-auto-deploy-dev')
          }
        }
        triggers {
          scm('H/5 * * * *')
        }
      }

      pipelineJob('release_tag_deploy') {
        description('Phát hiện release tag vX.Y.Z, build image theo tag, push Docker Hub và deploy vào staging.')
        parameters {
          stringParam('RELEASE_TAG', '', 'Tag phiên bản release, ví dụ: v1.0.0')
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/luc1fe4/yas.git')
                }
                branch('main')
              }
            }
            scriptPath('Jenkinsfile-release-tag')
          }
        }
      }

      multibranchPipelineJob('yas_ci') {
        description('CI Pipeline tự động quét và build cho mọi branch có commit mới.')
        branchSources {
          branchSource {
            source {
              git {
                id('yas-ci-git')
                remote('https://github.com/luc1fe4/yas.git')
                traits {
                  gitBranchDiscovery()
                }
              }
            }
          }
        }
        orphanedItemStrategy {
          discardOldItems {
            numToKeep(100)
          }
        }
      }